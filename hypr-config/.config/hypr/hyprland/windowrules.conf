windowrule = match:fullscreen true, idle_inhibit fullscreen # Stay awake in fullscreen

# Smart gaps
workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0
windowrule = border_size 0, match:float 0, match:workspace w[tv1]
windowrule = rounding 0, match:float 0, match:workspace w[tv1]
windowrule = border_size 0, match:float 0, match:workspace f[1]
windowrule = rounding 0, match:float 0, match:workspace f[1]
windowrule = suppress_event maximize, match:class .* # Ignore maximize events from windows

# Looking for another workaround
# exec-once = $HOME/.config/hypr/hyprland/scripts/google-sign-float.sh # Google sign in popup float firefox class issue (https://github.com/hyprwm/Hyprland/issues/3835)
windowrule = float true, border_size 0, match:class ^(thunar)$, match:title ^(File Operation Progress)$
windowrule = float true, border_size 0, match:class ^(kitty)$, match:title ^(top)$
windowrule = float true, border_size 0, match:class ^(kitty)$, match:title ^(btop)$
windowrule = float true, border_size 0, match:class ^(kitty)$, match:title ^(htop)$
windowrule = float true, border_size 0, match:class ^(kvantummanager)$
windowrule = float true, border_size 0, match:class ^(qt5ct)$
windowrule = float true, border_size 0, match:class ^(qt6ct)$
windowrule = float true, border_size 0, match:class ^(nwg-look)$
windowrule = float true, border_size 0, match:class ^(org.kde.ark)$
windowrule = float true, border_size 0, match:class ^(org.pulseaudio.pavucontroz)$
windowrule = float true, border_size 0, match:class ^(blueman-manager)$
windowrule = float true, border_size 0, match:class ^(nm-applet)$
windowrule = float true, border_size 0, match:class ^(nm-connection-editor)$
windowrule = float true, border_size 0, match:class ^(org.kde.polkit-kde-authentication-agent-1)$
windowrule = float true, border_size 0, match:class ^(io.missioncenter.MissionCenter)$ # MissionCenter-Gtk

general {
    allow_tearing = true
}

windowrule = immediate yes,  match:class ^(gamescope)$

